<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS投稿アシスト</title>
  <style>
    /* モダン＆シンプルなデザイン (iOS風) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      color: #1c1c1e;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 20px;
      color: #007aff;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    select, input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background-color: #f2f2f7;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 16px;
      color: #1c1c1e;
      transition: border-color 0.2s, background-color 0.2s;
      appearance: none;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #007aff;
      background-color: #ffffff;
    }
    
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: "▼";
      font-size: 0.8rem;
      color: #8e8e93;
      position: absolute;
      right: 14px;
      top: 14px;
      pointer-events: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }

    .dynamic-field {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e5ea;
    }
    .dynamic-field:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .dynamic-field .icon-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }
    .custom-input { display: none; margin-top: 8px; }

    .hashtag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .hashtag-label {
      background: #f2f2f7;
      color: #007aff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .hashtag-label:hover { background: #e5e5ea; }
    .hashtag-label input { margin: 0; width: 16px; height: 16px; accent-color: #007aff; }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-main { background-color: #007aff; color: #ffffff; box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3); }
    .btn-sub { background-color: #34c759; color: #ffffff; box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }

    /* アプリ連携ボタン用エリア（初期非表示） */
    #shortcutArea {
      display: none; /* 最初は隠しておく */
      animation: fadein 0.5s;
    }
    .shortcut-text {
      text-align: center;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .app-btn-group {
      display: flex;
      gap: 12px;
    }
    .btn-x { background-color: #000000; color: #ffffff; margin-bottom: 0; }
    .btn-ig { background-color: #E1306C; color: #ffffff; margin-bottom: 0; }

    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: rgba(28, 28, 30, 0.9);
      color: #fff;
      text-align: center;
      border-radius: 20px;
      padding: 12px 20px;
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      font-size: 0.9rem;
      font-weight: 500;
      backdrop-filter: blur(5px);
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.4s 2.5s forwards;
    }
    @keyframes fadein { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
    @keyframes fadeout { from {opacity: 1;} to {opacity: 0; visibility: hidden;} }
  </style>
</head>
<body>

  <h1>SNS投稿アシスト</h1>

  <div class="card">
    <label for="category">Scene</label>
    <div class="select-wrapper">
      <select id="category" onchange="changeCategory()">
        <option value="event">イベント・お祭り</option>
        <option value="zoo_horse">競馬場・動物園</option>
        <option value="live">TV・ラジオ実況</option>
        <option value="food">飲食店</option>
      </select>
    </div>
  </div>

  <div class="card">
    <label>Details</label>
    <div class="dynamic-field">
      <div class="icon-label">📅 <span>日付</span></div>
      <input type="text" id="postDate" placeholder="日付">
    </div>
    <div id="dynamicFieldsContainer"></div>
  </div>

  <div class="card">
    <label for="mainText">Message</label>
    <textarea id="mainText" placeholder="投稿の本文をここに入力します"></textarea>

    <label>Hashtags</label>
    <div id="hashtagContainer" class="hashtag-group"></div>
  </div>

  <button class="btn-main" onclick="copyAll()">すべて合体してコピー</button>
  <button class="btn-sub" onclick="copyTagsOnly()">タグのみコピー (速報用)</button>

  <!-- コピー後に表示されるアプリ連携エリア -->
  <div id="shortcutArea" class="card">
    <div class="shortcut-text">✅ コピー完了！次に開くアプリを選択</div>
    <div class="app-btn-group">
      <button class="btn-x" onclick="openApp('x')">𝕏 を開く</button>
      <button class="btn-ig" onclick="openApp('ig')">Instagram</button>
    </div>
  </div>

  <div id="toast">コピーしました！</div>

  <script>
    // --- データの定義 ---
    const data = {
      event: {
        fields: [
          { id: 'eventName', icon: '🎟️', label: 'イベント名', options: ['YOSAKOIソーラン祭り', 'さっぽろ雪まつり', 'ライラックまつり'] },
          { id: 'location', icon: '🎪', label: '場所', options: ['大通公園', '札幌ドーム', '札幌駅前'] }
        ],
        text: "チームの演舞、最高でした！\n",
        tags: ["#YOSAKOI", "#YOSAKOIソーラン", "#札幌", "#イベント", "#写真"],
        // 【追加】連動チェックルール：この単語を選んだら、右側のタグを自動でONにする
        autoCheck: {
          'YOSAKOIソーラン祭り': ["#YOSAKOI", "#YOSAKOIソーラン", "#イベント"],
          'さっぽろ雪まつり': ["#札幌", "#イベント", "#写真"]
        }
      },
      zoo_horse: {
        fields: [
          { id: 'location', icon: '🎪', label: '場所', options: ['帯広競馬場', 'ノーザンホースパーク', '札幌市円山動物園'] },
          { id: 'race', icon: '🐴', label: 'レース・競技', options: ['第1レース', 'メインレース', '中障害A飛越競技（予選）'] }
        ],
        text: "現地に到着しました！\n",
        tags: ["#ばんえい競馬", "#帯広競馬場", "#ノーザンホースパーク", "#馬", "#写真"],
        autoCheck: {
          '帯広競馬場': ["#ばんえい競馬", "#帯広競馬場", "#馬"],
          'ノーザンホースパーク': ["#ノーザンホースパーク", "#馬", "#写真"]
        }
      },
      live: {
        fields: [
          { id: 'program', icon: '📺', label: '番組名', options: ['（お気に入りの番組名1）'] }
        ],
        text: "実況中！\n",
        tags: ["#実況", "#TV", "#ラジオ", "#オンエア"],
        autoCheck: {}
      },
      food: {
        fields: [
          { id: 'shop', icon: '🍽️', label: 'お店', options: ['（お気に入りカフェ）'] }
        ],
        text: "いただきます！\n",
        tags: ["#札幌グルメ", "#ランチ", "#カフェ", "#美味しい"],
        autoCheck: {}
      }
    };

    function getTodayDate() {
      const today = new Date();
      return `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;
    }

    function changeCategory() {
      // 切り替え時はショートカットを隠す
      document.getElementById('shortcutArea').style.display = 'none';

      const category = document.getElementById('category').value;
      const currentData = data[category];
      
      document.getElementById('postDate').value = getTodayDate();
      document.getElementById('mainText').value = currentData.text;
      
      // ハッシュタグの生成 (初期値はすべて false/チェックなし)
      const tagContainer = document.getElementById('hashtagContainer');
      tagContainer.innerHTML = '';
      currentData.tags.forEach(tag => {
        const label = document.createElement('label');
        label.className = 'hashtag-label';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = 'hashtags';
        checkbox.value = tag;
        checkbox.checked = false; // ★初期値は外す
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(tag));
        tagContainer.appendChild(label);
      });

      // 動的フィールド（プルダウン）の生成
      const fieldsContainer = document.getElementById('dynamicFieldsContainer');
      fieldsContainer.innerHTML = '';

      currentData.fields.forEach(field => {
        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'dynamic-field';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'icon-label';
        labelDiv.innerHTML = `${field.icon} <span>${field.label}</span>`;
        fieldDiv.appendChild(labelDiv);

        const selectWrapper = document.createElement('div');
        selectWrapper.className = 'select-wrapper';

        const select = document.createElement('select');
        select.id = `select_${field.id}`;
        
        // 「選択してください」という初期の空の選択肢を追加
        const defaultOption = document.createElement('option');
        defaultOption.value = "";
        defaultOption.textContent = "選択してください";
        select.appendChild(defaultOption);

        field.options.forEach(opt => {
          const option = document.createElement('option');
          option.value = opt;
          option.textContent = opt;
          select.appendChild(option);
        });
        
        const otherOption = document.createElement('option');
        otherOption.value = "__other__";
        otherOption.textContent = "その他（自由入力）";
        select.appendChild(otherOption);

        selectWrapper.appendChild(select);
        fieldDiv.appendChild(selectWrapper);

        const customInput = document.createElement('input');
        customInput.type = 'text';
        customInput.id = `custom_${field.id}`;
        customInput.className = 'custom-input';
        customInput.placeholder = `${field.label}を入力してください`;
        fieldDiv.appendChild(customInput);

        // プルダウン変更時のイベント（自由入力の表示 ＋ 連動ハッシュタグ）
        select.addEventListener('change', function() {
          // 自由入力の切り替え
          if (this.value === '__other__') {
            customInput.style.display = 'block';
            customInput.focus();
          } else {
            customInput.style.display = 'none';
          }

          // 連動ハッシュタグの処理
          const selectedValue = this.value;
          const autoCheckRules = currentData.autoCheck;
          if (autoCheckRules && autoCheckRules[selectedValue]) {
            const targetTags = autoCheckRules[selectedValue];
            const checkboxes = document.querySelectorAll('input[name="hashtags"]');
            checkboxes.forEach(cb => {
              if (targetTags.includes(cb.value)) {
                cb.checked = true; // 関連タグをオンにする
              }
            });
          }
        });

        fieldsContainer.appendChild(fieldDiv);
      });
    }

    // ハッシュタグのフォーマット（複数ある場合は2行に分ける処理は維持）
    function getFormattedTags() {
      const checkboxes = document.querySelectorAll('input[name="hashtags"]:checked');
      const tags = Array.from(checkboxes).map(cb => cb.value);

      if (tags.length === 0) return '';
      if (tags.length === 1) return tags[0];

      const mid = Math.ceil(tags.length / 2);
      const line1 = tags.slice(0, mid).join(' ');
      const line2 = tags.slice(mid).join(' ');
      return line1 + '\n' + line2;
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast();
        // ★コピー成功時にショートカットエリアを表示する
        document.getElementById('shortcutArea').style.display = 'block';
      }).catch(err => {
        alert('コピーに失敗しました。');
      });
    }

    function copyAll() {
      const date = document.getElementById('postDate').value.trim();
      let headerText = '';
      if (date) headerText += `📅${date}\n`;

      const category = document.getElementById('category').value;
      const currentData = data[category];
      
      currentData.fields.forEach(field => {
        const select = document.getElementById(`select_${field.id}`);
        const custom = document.getElementById(`custom_${field.id}`);
        
        let val = '';
        if (select.value === '__other__') {
          val = custom.value.trim();
        } else if (select.value !== "") {
          val = select.value;
        }
        
        if (val) {
          headerText += `${field.icon}${val}\n`;
        }
      });

      const mainText = document.getElementById('mainText').value.trim();
      const formattedTags = getFormattedTags();
      
      let finalParts = [];
      if (headerText) finalParts.push(headerText.trim());
      if (mainText) finalParts.push(mainText);
      if (formattedTags) finalParts.push(formattedTags);

      const finalString = finalParts.join('\n\n');
      copyToClipboard(finalString);
    }

    function copyTagsOnly() {
      const formattedTags = getFormattedTags();
      copyToClipboard(formattedTags);
    }

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      toast.style.animation = 'none';
      toast.offsetHeight;
      toast.style.animation = null; 
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // アプリを開く機能
    function openApp(app) {
      if (app === 'x') {
        // Xの投稿画面（Web版）またはアプリが開きます
        window.open('https://twitter.com/intent/tweet', '_blank');
      } else if (app === 'ig') {
        // Instagramを開きます
        window.open('https://www.instagram.com/', '_blank');
      }
    }

    window.onload = changeCategory;
  </script>
</body>
</html>
